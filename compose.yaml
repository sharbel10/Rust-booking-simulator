name: booking-simulator

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_demo
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_demo_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  booking_data:

