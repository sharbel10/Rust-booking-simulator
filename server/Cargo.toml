[package]
name = "booking-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
booking-core = { path = "../booking-core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

tower-http = { version = "0.6", features = ["fs"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
